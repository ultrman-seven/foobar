<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>加载页面</title>
    <style>
      /* 极简样式：仅让 iframe 铺满窗口 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
      .tip {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-family: sans-serif;
        color: #666;
      }
        button {
			appearance: none;
			border: 0;
			cursor: pointer;
			border-radius: 16px;
			padding: 14px 22px;
			font: inherit;
			font-weight: 700;
			transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
		}
		button:hover {
			transform: translateY(-1px);
		}
		button:active {
			transform: translateY(1px) scale(0.98);
		}
      .btn {
			color: #04111e;
			background: linear-gradient(135deg, #8df0c3, #7aa8ff);
			box-shadow: 0 12px 30px rgba(122, 168, 255, 0.25);
      }
    </style>
  </head>
  <body>
    <button id="btn" style="display: none" class="btn">点我</button>
    <script>
      (function () {
        // 1. 解析 URL 参数 frdName
        const params = new URLSearchParams(window.location.search);
        const frdName = params.get("frdName")?.trim();

        // 2. 无参数时显示提示
        if (!frdName) {
          document.body.innerHTML =
            '<div class="tip">请在 URL 中添加 ?frdName=名称 参数</div>';
          return;
        }

        // 3. 安全校验（防止路径遍历等）
        function isValid(name) {
          // 只允许字母、数字、中文、下划线、连字符、点（不能以点开头）
          if (!name || name.length > 80) return false;
          if (name.startsWith(".")) return false;
          if (/\.\.|\\|\/|~/.test(name)) return false;
          return /^[\u4e00-\u9fa5a-zA-Z0-9_\-\.]+$/.test(name);
        }

        if (!isValid(frdName)) {
          document.body.innerHTML =
            '<div class="tip">⚠️ 参数不合法，请检查</div>';
          return;
        }
        if (frdName == "zg") {
          const btn = document.getElementById("btn");
          btn.style.display = "block";
          btn.addEventListener("click", () => {
            window.location.href = "./zg.html";
          });
        } else if (frdName == "hf") {
          window.location.href = "./hflm.html";
        }
      })();
    </script>
  </body>
</html>
