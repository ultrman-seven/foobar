<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇智波斑 - 火遁・豪火球之术 (循环)</title>
    <style>
        :root {
            --bg: #0a0a0a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', 'Noto Serif SC', sans-serif;
            user-select: none;
        }

        .container {
            position: relative;
            width: 95vw;
            max-width: 1000px;
            aspect-ratio: 16/9;
            max-height: 90vh;
            border: 3px solid #2a1a0a;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(200, 80, 20, 0.35), 0 0 80px rgba(255, 120, 30, 0.2), inset 0 0 0 1px rgba(180, 100, 40, 0.25);
            background: #0d0d0d;
            animation: borderGlow 3s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%,
            100% {
                border-color: rgba(200, 120, 40, 0.4);
                box-shadow: 0 0 20px rgba(200, 80, 20, 0.25);
            }
            50% {
                border-color: rgba(255, 160, 50, 0.8);
                box-shadow: 0 0 55px rgba(255, 100, 30, 0.55);
            }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 6px;
        }

        .title-overlay {
            position: absolute;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            text-align: center;
            transition: opacity 0.3s;
        }
        .title-overlay.visible {
            opacity: 1;
        }
        .title-overlay .main-title {
            font-size: clamp(1.1rem, 2.8vw, 2rem);
            color: #ff6020;
            text-shadow: 0 0 10px #ff4000, 0 0 30px #ff3000, 0 0 60px #ff2000, 0 2px 6px rgba(0,0,0,0.9);
            letter-spacing: 0.08em;
            font-weight: bold;
            animation: titleFlicker 0.15s infinite alternate;
        }
        @keyframes titleFlicker {
            0% {
                text-shadow: 0 0 10px #ff4000, 0 0 30px #ff3000;
            }
            100% {
                text-shadow: 0 0 18px #ff5000, 0 0 42px #ff3500, 0 0 80px #ff2500;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <canvas id="canvas"></canvas>
        <div class="title-overlay" id="titleOverlay">
            <div class="main-title">火遁・豪火球の術</div>
        </div>
    </div>

    <script>
        (function() {
            const container = document.getElementById('container');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const titleOverlay = document.getElementById('titleOverlay');

            // 内部坐标系
            const W = 1000;
            const H = 562;
            let scale = 1;

            function resize() {
                const rect = container.getBoundingClientRect();
                scale = Math.min(rect.width / W, rect.height / H);
                canvas.width = W;
                canvas.height = H;
                canvas.style.width = (W * scale) + 'px';
                canvas.style.height = (H * scale) + 'px';
            }
            resize();
            window.addEventListener('resize', resize);

            // ---------- 宇智波斑图片 ----------
            // ★ 请将下方链接替换为你自己的宇智波斑图片URL（建议使用正面、半身、有嘴部位置的素材）
            // ★ 图片需要支持跨域访问，否则 Canvas 会污染无法读取像素（但不影响绘制）
            const MADARA_IMAGE_URL = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTvTPigy9O6nzTuv2gPeEbjnhYuguC8Ab7ECLrBQ52ruAN1LRycrg7pze8&s=10';
            // const MADARA_IMAGE_URL = 'https://w9.talentsays.com/upload/famousphoto/Famous5799.png';
            // 备用：如果图片加载失败，可以使用一个简单的SVG数据URI占位（此处为一个深色人形轮廓）
            const FALLBACK_IMAGE = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 300%22%3E%3Crect fill=%22%231a1a1a%22 width=%22200%22 height=%22300%22/%3E%3Ccircle fill=%22%23e0c8a8%22 cx=%22100%22 cy=%22100%22 r=%2230%22/%3E%3Crect fill=%22%23b83020%22 x=%2270%22 y=%22130%22 width=%2260%22 height=%2270%22/%3E%3Ctext fill=%22white%22 x=%22100%22 y=%22260%22 text-anchor=%22middle%22 font-size=%2220%22%3E斑%3C/text%3E%3C/svg%3E';

            const madaraImage = new Image();
            madaraImage.crossOrigin = 'anonymous'; // 尝试匿名跨域
            madaraImage.src = MADARA_IMAGE_URL;
            let imageLoaded = false;
            let imageError = false;

            madaraImage.onload = () => {
                imageLoaded = true;
                console.log('宇智波斑图片加载成功');
            };
            madaraImage.onerror = () => {
                console.warn('图片加载失败，使用备用图形');
                imageError = true;
                // 加载备用图片
                madaraImage.src = FALLBACK_IMAGE;
                // 备用图片也是 Image，再次触发 onload
                madaraImage.onload = () => {
                    imageLoaded = true;
                    imageError = false; // 标记为备用已加载
                };
            };

            // 图片在Canvas上的绘制参数（可根据实际图片调整）
            const IMAGE_CONFIG = {
                drawWidth: 230,   // 绘制宽度
                drawHeight: 300,  // 绘制高度
                posX: 80,         // 左上角X坐标
                posY: 180,        // 左上角Y坐标（地面线约在H*0.78 ≈ 438）
                // 嘴部在图片中的相对位置（用于火球起始点）
                mouthRelX: 0.82,  // 相对于图片宽度（右侧）
                mouthRelY: 0.38,  // 相对于图片高度（上方）
            };

            function getMouthPosition() {
                return {
                    x: IMAGE_CONFIG.posX + IMAGE_CONFIG.drawWidth * IMAGE_CONFIG.mouthRelX,
                    y: IMAGE_CONFIG.posY + IMAGE_CONFIG.drawHeight * IMAGE_CONFIG.mouthRelY
                };
            }

            // ---------- 粒子系统 ----------
            let particles = [];
            let bgEmbers = [];

            function initBgEmbers() {
                bgEmbers = [];
                for (let i = 0; i < 55; i++) {
                    bgEmbers.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        size: Math.random() * 2.8 + 0.4,
                        speedY: -(Math.random() * 0.7 + 0.2),
                        speedX: (Math.random() - 0.5) * 0.6,
                        opacity: Math.random() * 0.8 + 0.2,
                        life: Math.random() * 400 + 100,
                        maxLife: 500,
                        hue: Math.random() * 25 + 15,
                    });
                }
            }
            initBgEmbers();

            function spawnParticle(x, y, type) {
                const p = {
                    x, y, type,
                    life: 0,
                    maxLife: 0,
                    size: 0,
                    vx: 0, vy: 0,
                    opacity: 1,
                    hue: 0,
                };
                switch (type) {
                    case 'spark':
                        p.maxLife = 35 + Math.random() * 55;
                        p.size = Math.random() * 4.5 + 1.5;
                        const angle = Math.random() * Math.PI * 2;
                        const speed = Math.random() * 7 + 2.5;
                        p.vx = Math.cos(angle) * speed;
                        p.vy = Math.sin(angle) * speed - Math.random() * 6;
                        p.hue = 20 + Math.random() * 30;
                        break;
                    case 'smoke':
                        p.maxLife = 70 + Math.random() * 90;
                        p.size = Math.random() * 9 + 3;
                        p.vx = (Math.random() - 0.5) * 2;
                        p.vy = -(Math.random() * 2.5 + 1.5);
                        p.opacity = 0.45 + Math.random() * 0.45;
                        p.hue = 10 + Math.random() * 20;
                        break;
                    case 'flame_trail':
                        p.maxLife = 22 + Math.random() * 38;
                        p.size = Math.random() * 7.5 + 3;
                        p.vx = -(Math.random() * 3.5 + 1.2);
                        p.vy = (Math.random() - 0.5) * 4.5;
                        p.hue = 22 + Math.random() * 20;
                        p.opacity = 0.85;
                        break;
                    case 'burst':
                        p.maxLife = 28 + Math.random() * 45;
                        p.size = Math.random() * 6.5 + 2.2;
                        const ba = Math.random() * Math.PI * 2;
                        const bs = Math.random() * 11 + 5;
                        p.vx = Math.cos(ba) * bs;
                        p.vy = Math.sin(ba) * bs;
                        p.hue = 18 + Math.random() * 35;
                        p.opacity = 1;
                        break;
                    default: break;
                }
                particles.push(p);
            }

            // ---------- 火球循环参数 ----------
            const FIREBALL_INTERVAL = 3800; // 每3.8秒生成一个新火球
            const PREPARE_TIME = 900;        // 结印蓄力时间（视觉）
            const RELEASE_TIME = 500;        // 喷出时间
            const FLY_TIME = 2400;           // 飞行膨胀时间
            const DISSIPATE_TIME = 900;      // 消散时间

            let fireballs = [];
            let lastFireballTimestamp = -FIREBALL_INTERVAL; // 立即开始第一个
            let shakeAmount = 0;
            let titleAlpha = 0;

            function createFireball(mouth) {
                return {
                    x: mouth.x,
                    y: mouth.y,
                    radius: 12,
                    maxRadius: 120 + Math.random() * 40,
                    alpha: 1,
                    alive: true,
                    phase: 'release', // 'release' | 'fly' | 'dissipate'
                    phaseTime: 0,
                };
            }

            // ---------- 绘制背景 ----------
            function drawBackground() {
                // 夜空
                const grad = ctx.createLinearGradient(0, 0, 0, H * 0.78);
                grad.addColorStop(0, '#0a0a12');
                grad.addColorStop(0.5, '#0f0d18');
                grad.addColorStop(1, '#1a1218');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H * 0.78);

                // 山脉
                ctx.fillStyle = 'rgba(12,10,16,0.8)';
                ctx.beginPath();
                ctx.moveTo(0, H * 0.72);
                for (let x = 0; x <= W; x += 20) {
                    const y = H * 0.72 - Math.sin(x * 0.004) * 55 - Math.sin(x * 0.013 + 2) * 35 - 25;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(W, H * 0.8);
                ctx.lineTo(0, H * 0.8);
                ctx.closePath();
                ctx.fill();

                // 月亮
                const mx = W * 0.83, my = H * 0.23;
                const glow = ctx.createRadialGradient(mx, my, 8, mx, my, 60);
                glow.addColorStop(0, 'rgba(210,210,230,0.25)');
                glow.addColorStop(0.5, 'rgba(180,180,210,0.08)');
                glow.addColorStop(1, 'rgba(100,100,140,0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(mx, my, 60, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = 'rgba(220,220,235,0.3)';
                ctx.beginPath();
                ctx.arc(mx, my, 13, 0, Math.PI*2);
                ctx.fill();
            }

            function drawGround() {
                const gy = H * 0.78;
                const grad = ctx.createLinearGradient(0, gy, 0, H);
                grad.addColorStop(0, '#1c1815');
                grad.addColorStop(1, '#0b0906');
                ctx.fillStyle = grad;
                ctx.fillRect(0, gy, W, H - gy);
                ctx.strokeStyle = 'rgba(70,45,25,0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, gy);
                ctx.lineTo(W, gy);
                ctx.stroke();
                return gy;
            }

            // 绘制火球（多层动态扰动）
            function drawFireball(x, y, radius, alpha) {
                if (radius < 2 || alpha < 0.03) return;
                ctx.save();
                ctx.globalAlpha = alpha;

                const time = performance.now() * 0.002;
                // 外层光晕
                const outer = ctx.createRadialGradient(x, y, radius*0.4, x, y, radius*1.4);
                outer.addColorStop(0, 'rgba(200,40,10,0.7)');
                outer.addColorStop(0.6, 'rgba(150,25,5,0.3)');
                outer.addColorStop(1, 'rgba(80,10,2,0)');
                ctx.fillStyle = outer;
                ctx.beginPath();
                ctx.arc(x, y, radius*1.4, 0, Math.PI*2);
                ctx.fill();

                // 扰动层
                for (let l=0; l<3; l++) {
                    const lr = radius * (1.1 - l*0.18);
                    const amp = radius * (0.15 + l*0.13);
                    const freq = 9 + l*4;
                    const phase = time*(0.07 + l*0.03) + l*1.5;
                    ctx.beginPath();
                    for (let i=0; i<=60; i++) {
                        const ang = (i/60)*Math.PI*2;
                        const r = lr + Math.sin(ang*freq+phase)*amp + Math.cos(ang*(freq+3)-phase*0.6)*amp*0.5;
                        const px = x + Math.cos(ang)*r;
                        const py = y + Math.sin(ang)*r;
                        if (i===0) ctx.moveTo(px,py);
                        else ctx.lineTo(px,py);
                    }
                    ctx.closePath();
                    let grad;
                    if (l===0) {
                        grad = ctx.createRadialGradient(x,y,radius*0.3, x,y,lr+amp);
                        grad.addColorStop(0,'rgba(255,210,70,0.9)');
                        grad.addColorStop(0.3,'rgba(255,150,30,0.8)');
                        grad.addColorStop(0.6,'rgba(230,80,12,0.6)');
                        grad.addColorStop(1,'rgba(170,35,5,0.15)');
                    } else if (l===1) {
                        grad = ctx.createRadialGradient(x,y,radius*0.5, x,y,lr+amp);
                        grad.addColorStop(0,'rgba(255,140,25,0.7)');
                        grad.addColorStop(0.5,'rgba(210,60,8,0.5)');
                        grad.addColorStop(1,'rgba(140,25,3,0.08)');
                    } else {
                        grad = ctx.createRadialGradient(x,y,radius*0.6, x,y,lr+amp);
                        grad.addColorStop(0,'rgba(220,60,15,0.45)');
                        grad.addColorStop(1,'rgba(100,18,2,0.03)');
                    }
                    ctx.fillStyle = grad;
                    ctx.fill();
                }
                // 核心白热
                const core = ctx.createRadialGradient(x,y,0, x,y,radius*0.45);
                core.addColorStop(0,'rgba(255,255,245,1)');
                core.addColorStop(0.2,'rgba(255,240,180,0.9)');
                core.addColorStop(0.5,'rgba(255,180,60,0.6)');
                core.addColorStop(0.8,'rgba(240,100,20,0.1)');
                core.addColorStop(1,'rgba(200,50,10,0)');
                ctx.fillStyle = core;
                ctx.beginPath();
                ctx.arc(x, y, radius*0.8, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();
            }

            // ---------- 主循环 ----------
            function update(timestamp) {
                // 屏幕震动衰减
                let sx = 0, sy = 0;
                if (shakeAmount > 0.01) {
                    sx = (Math.random()-0.5)*shakeAmount*2;
                    sy = (Math.random()-0.5)*shakeAmount*2;
                    shakeAmount *= 0.88;
                }

                ctx.clearRect(0,0,W,H);
                drawBackground();
                const groundY = drawGround();

                // 背景火星
                for (let ember of bgEmbers) {
                    ember.y += ember.speedY;
                    ember.x += ember.speedX;
                    ember.life--;
                    if (ember.life <= 0 || ember.y < -15 || ember.y > H+15) {
                        ember.y = H + Math.random()*35;
                        ember.x = Math.random()*W;
                        ember.life = ember.maxLife;
                    }
                    const alpha = ember.opacity * Math.min(1, ember.life/70) * Math.min(1, (ember.maxLife-ember.life)/70);
                    ctx.fillStyle = `hsla(${ember.hue}, 90%, 55%, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(ember.x + sx*0.3, ember.y + sy*0.3, ember.size, 0, 2*Math.PI);
                    ctx.fill();
                }

                // 绘制宇智波斑（图片）
                if (imageLoaded) {
                    ctx.drawImage(
                        madaraImage,
                        IMAGE_CONFIG.posX + sx, IMAGE_CONFIG.posY + sy,
                        IMAGE_CONFIG.drawWidth, IMAGE_CONFIG.drawHeight
                    );
                } else {
                    // 加载中占位
                    ctx.fillStyle = '#2a2a2a';
                    ctx.fillRect(IMAGE_CONFIG.posX, IMAGE_CONFIG.posY, IMAGE_CONFIG.drawWidth, IMAGE_CONFIG.drawHeight);
                    ctx.fillStyle = '#aaa';
                    ctx.font = '16px sans-serif';
                    ctx.fillText('加载中...', IMAGE_CONFIG.posX+60, IMAGE_CONFIG.posY+150);
                }
                const mouth = getMouthPosition();
                mouth.x += sx;
                mouth.y += sy;

                // 生成新火球（循环）
                const now = timestamp;
                if (now - lastFireballTimestamp >= FIREBALL_INTERVAL && imageLoaded) {
                    fireballs.push(createFireball(mouth));
                    lastFireballTimestamp = now;
                    shakeAmount = Math.max(shakeAmount, 7);
                    titleAlpha = 1;
                    // 爆发粒子
                    for (let i=0; i<70; i++) spawnParticle(mouth.x, mouth.y, 'burst');
                    for (let i=0; i<30; i++) spawnParticle(mouth.x, mouth.y, 'spark');
                }

                // 更新火球
                for (let fb of fireballs) {
                    if (!fb.alive) continue;
                    fb.phaseTime += 16.67; // 近似帧时间
                    const mouthNow = getMouthPosition(); // 实时嘴部位置
                    mouthNow.x += sx;
                    mouthNow.y += sy;

                    if (fb.phase === 'release') {
                        const t = Math.min(1, fb.phaseTime / RELEASE_TIME);
                        const ease = 1 - Math.pow(1-t, 3);
                        fb.x = mouthNow.x + ease * 55;
                        fb.y = mouthNow.y - ease * 10;
                        fb.radius = 12 + ease * 38;
                        fb.alpha = Math.min(1, t * 3);
                        if (fb.phaseTime >= RELEASE_TIME) {
                            fb.phase = 'fly';
                            fb.phaseTime = 0;
                        }
                    } else if (fb.phase === 'fly') {
                        const t = Math.min(1, fb.phaseTime / FLY_TIME);
                        const easeT = t < 0.2 ? t/0.2*0.5 : 0.5 + (t-0.2)/0.8*0.5;
                        fb.x = mouth.x + 55 + easeT * 620;
                        fb.y = mouth.y - 10 + easeT * 18;
                        fb.radius = 12 + 38 + t * (fb.maxRadius - 50);
                        fb.alpha = 1;
                        if (Math.random()<0.7) {
                            spawnParticle(fb.x - fb.radius*0.7, fb.y + (Math.random()-0.5)*fb.radius, 'flame_trail');
                        }
                        if (fb.phaseTime >= FLY_TIME) {
                            fb.phase = 'dissipate';
                            fb.phaseTime = 0;
                        }
                    } else if (fb.phase === 'dissipate') {
                        const t = Math.min(1, fb.phaseTime / DISSIPATE_TIME);
                        fb.alpha = 1 - t;
                        fb.radius += 2.5;
                        fb.x += 4;
                        fb.y -= 2.5;
                        if (Math.random()<0.5) spawnParticle(fb.x, fb.y + (Math.random()-0.5)*fb.radius, 'smoke');
                        if (t >= 1) fb.alive = false;
                    }

                    // 持续火花
                    if (fb.alpha > 0.5 && fb.radius > 20 && fb.phase !== 'dissipate') {
                        if (Math.random()<0.6) {
                            const sx2 = fb.x + (Math.random()-0.5)*fb.radius*1.8;
                            const sy2 = fb.y + (Math.random()-0.5)*fb.radius*1.8;
                            spawnParticle(sx2, sy2, 'spark');
                        }
                    }
                }
                fireballs = fireballs.filter(fb => fb.alive);

                // 更新粒子
                for (let p of particles) {
                    p.life += 16.67;
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.type==='smoke') { p.size+=0.15; p.opacity-=0.012; p.vy-=0.03; }
                    else if (p.type==='spark') { p.vy+=0.08; p.opacity-=0.018; p.size*=0.985; }
                    else if (p.type==='flame_trail') { p.opacity-=0.025; p.size*=0.97; p.vy-=0.05; }
                    else if (p.type==='burst') { p.opacity-=0.022; p.size*=0.99; p.vx*=0.96; p.vy*=0.96; }
                }
                particles = particles.filter(p => p.life < p.maxLife && p.opacity > 0.01 && p.size > 0.1);

                // 绘制粒子
                for (let p of particles) {
                    const a = p.opacity * Math.min(1, (p.maxLife-p.life)/20);
                    if (p.type==='smoke') {
                        const sg = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size);
                        sg.addColorStop(0,`rgba(70,50,35,${a*0.6})`);
                        sg.addColorStop(0.5,`rgba(50,35,25,${a*0.3})`);
                        sg.addColorStop(1,'rgba(30,20,15,0)');
                        ctx.fillStyle = sg;
                        ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,2*Math.PI); ctx.fill();
                    } else {
                        ctx.fillStyle = `hsla(${p.hue}, 100%, ${p.type==='burst'?'60%':'55%'}, ${a})`;
                        ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,2*Math.PI); ctx.fill();
                        if (p.size>2) {
                            ctx.fillStyle = `hsla(${p.hue}, 100%, 85%, ${a*0.6})`;
                            ctx.beginPath(); ctx.arc(p.x,p.y,p.size*0.4,0,2*Math.PI); ctx.fill();
                        }
                    }
                }

                // 绘制火球
                for (let fb of fireballs) {
                    if (fb.alive && fb.alpha>0.01) {
                        drawFireball(fb.x, fb.y, fb.radius, fb.alpha);
                    }
                }

                // 地面火光反射
                for (let fb of fireballs) {
                    if (fb.alive && fb.alpha>0.1 && fb.radius>15) {
                        const ry = groundY + 5;
                        const dist = Math.abs(fb.y - ry);
                        const ra = fb.alpha * Math.max(0, 1-dist/300) * 0.45;
                        if (ra > 0.01) {
                            const rg = ctx.createRadialGradient(fb.x, ry, fb.radius*0.2, fb.x, ry, fb.radius*1.8);
                            rg.addColorStop(0,`rgba(255,120,30,${ra})`);
                            rg.addColorStop(0.5,`rgba(200,60,15,${ra*0.5})`);
                            rg.addColorStop(1,'rgba(150,30,5,0)');
                            ctx.fillStyle = rg;
                            ctx.beginPath();
                            ctx.ellipse(fb.x, ry, fb.radius*1.8, fb.radius*0.5, 0, 0, 2*Math.PI);
                            ctx.fill();
                        }
                    }
                }

                // 标题显示
                if (titleAlpha > 0.01) {
                    titleAlpha *= 0.985;
                    titleOverlay.classList.add('visible');
                    titleOverlay.style.opacity = Math.min(1, titleAlpha);
                } else {
                    titleOverlay.classList.remove('visible');
                    titleOverlay.style.opacity = '0';
                }

                requestAnimationFrame(update);
            }

            requestAnimationFrame(update);

            // 窗口大小变化时重新计算
            window.addEventListener('resize', () => {
                resize();
                initBgEmbers();
            });

            console.log('🔥 火遁・豪火球の術 - 循环播放');
            console.log('   宇智波斑形象使用网络图片，火球每' + (FIREBALL_INTERVAL/1000) + '秒释放一次');
        })();
    </script>
</body>
</html>
